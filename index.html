<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple GitHub Extractor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 10px; color: #333; }
        .search-box { margin-bottom: 25px; }
        input {
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 250px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            background-color: #2ea44f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        button:hover { background-color: #2c974b; }
        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 350px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .profile-info {
            text-align: center;
        }
        .card img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #ddd;
            margin-bottom: 10px;
        }
        .card h3 { margin: 5px 0; color: #111; }
        .card p { color: #555; font-size: 14px; margin: 8px 0; }
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            padding: 10px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            color: #444;
        }
        .repos-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .repo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 13px;
        }
        .repo-list li {
            margin-bottom: 6px;
        }
        .repo-list a {
            color: #0366d6;
            text-decoration: none;
        }
        .repo-list a:hover {
            text-decoration: underline;
        }
        .hidden { display: none; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h2>GitHub Profile Extractor</h2>
    
    <div class="search-box">
        <input type="text" id="username" placeholder="Enter username...">
        <button onclick="getProfile()">Search</button>
    </div>

    <p id="error" class="error hidden">User not found!</p>

    <div id="profileCard" class="card hidden">
        <div class="profile-info">
            <img id="avatar" src="" alt="Avatar">
            <h3 id="name"></h3>
            <p id="bio"></p>
        </div>
        
        <div class="stats">
            <div><strong>Repos:</strong> <span id="repos"></span></div>
            <div><strong>Followers:</strong> <span id="followers"></span></div>
        </div>

        <div class="repos-title">Latest Repositories:</div>
        <ul id="repoList" class="repo-list"></ul>
    </div>

    <script>
        async function getProfile() {
            const username = document.getElementById('username').value.trim();
            const card = document.getElementById('profileCard');
            const error = document.getElementById('error');

            if (!username) return;

            card.classList.add('hidden');
            error.classList.add('hidden');

            try {
                // Fetch profile and repos in parallel
                const [userRes, repoRes] = await Promise.all([
                    fetch(`https://api.github.com/users/${username}`),
                    fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=5`)
                ]);

                if (!userRes.ok) throw new Error("Not found");

                const userData = await userRes.json();
                const repoData = await repoRes.json();

                // Fill profile details
                document.getElementById('avatar').src = userData.avatar_url;
                document.getElementById('name').textContent = userData.name || userData.login;
                document.getElementById('bio').textContent = userData.bio || 'No bio available.';
                document.getElementById('repos').textContent = userData.public_repos;
                document.getElementById('followers').textContent = userData.followers;

                // Fill latest 5 repos
                const repoList = document.getElementById('repoList');
                repoList.innerHTML = '';
                
                if (repoData.length === 0) {
                    repoList.innerHTML = '<li>No public repositories.</li>';
                } else {
                    repoData.forEach(repo => {
                        const li = document.createElement('li');
                        li.innerHTML = `<a href="${repo.html_url}" target="_blank">📦 ${repo.name}</a>`;
                        repoList.appendChild(li);
                    });
                }

                card.classList.remove('hidden');
            } catch (err) {
                error.classList.remove('hidden');
            }
        }
    </script>

</body>
</html>
